<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanvi AI – Beta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a2e;
            --border: #2a2a3e;
            --accent: #7c8aff;
            --accent-hover: #6b78e0;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --user-bubble: #7c8aff;
            --tanvi-bubble: #1e1e2e;
            --error-bg: #3a1a1a;
            --error-border: #5a2a2a;
            --error-text: #ff6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-secondary);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 138, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 92vh;
            backdrop-filter: blur(20px);
        }

        .chat-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #1e1e3a 100%);
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c8aff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .header-info h1 {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header-info .subtitle {
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #f44336;
            animation: none;
        }

        .status-indicator.connecting {
            background: #ff9800;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-icon:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 5px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.65;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.tanvi {
            align-self: flex-start;
            background: var(--tanvi-bubble);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .message.error {
            align-self: center;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            font-size: 0.85rem;
            max-width: 90%;
            text-align: center;
        }

        .message .msg-time {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 6px;
            text-align: right;
        }

        .message.tanvi .msg-time {
            color: rgba(255, 255, 255, 0.25);
        }

        /* Markdown / Code styling */
        .message.tanvi pre {
            background: #0d0d1a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
            margin: 10px 0;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .message.tanvi code {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.82rem;
            background: rgba(124, 138, 255, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .message.tanvi pre code {
            background: transparent;
            padding: 0;
            font-size: 0.8rem;
        }

        .message.tanvi p {
            margin-bottom: 8px;
        }

        .message.tanvi p:last-child {
            margin-bottom: 0;
        }

        .message.tanvi ul, .message.tanvi ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .message.tanvi li {
            margin-bottom: 3px;
        }

        .message.tanvi strong {
            color: #fff;
        }

        .message.tanvi blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 14px;
            margin: 8px 0;
            color: #aaa;
        }

        .message.tanvi table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
            font-size: 0.85rem;
        }

        .message.tanvi th, .message.tanvi td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .message.tanvi th {
            background: var(--bg-tertiary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-indicator {
            align-self: flex-start;
            display: flex;
            gap: 4px;
            padding: 14px 18px;
            background: var(--tanvi-bubble);
            border: 1px solid var(--border);
            border-radius: 18px;
            border-bottom-left-radius: 6px;
        }

        .typing-indicator span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        .chat-input-container {
            padding: 16px 20px 20px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }

        .chat-input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--bg-tertiary);
            border-radius: 18px;
            border: 1px solid var(--border);
            padding: 6px 8px 6px 18px;
            transition: border-color 0.2s;
        }

        .chat-input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .chat-input-wrapper textarea {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            outline: none;
            padding: 10px 0;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.5;
        }

        .chat-input-wrapper textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-size: 18px;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .input-hint {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-align: right;
            padding: 6px 8px 0 0;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            .message {
                max-width: 92%;
            }
            .chat-messages {
                padding: 16px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="avatar">T</div>
                <div class="header-info">
                    <h1>Tanvi AI</h1>
                    <div class="subtitle">
                        <span class="status-indicator connecting" id="statusDot"></span>
                        <span id="statusText">Connecting...</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="clearChat()" title="Clear chat">🗑</button>
                <button class="btn-icon" onclick="scrollToBottom()" title="Scroll down">↓</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Message Tanvi..." autofocus></textarea>
                <button class="send-btn" id="sendBtn" title="Send message">➤</button>
            </div>
            <div class="input-hint">Press Enter to send, Shift+Enter for new line</div>
        </div>
    </div>


    <script>
        // ===================== CONFIGURATION =====================
        const API_URL = "https://tanviai.onrender.com/chat";
        const API_KEY = "tanvi-beta-2024-dhruv";
        // =========================================================

        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const messagesDiv = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Session management
        let sessionId = localStorage.getItem('tanvi_session');
        if (!sessionId) {
            sessionId = 'user_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('tanvi_session', sessionId);
        }

        // Configure marked for safe rendering
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            messagesDiv.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            if (sender === 'tanvi') {
                // Use marked to parse markdown
                const htmlContent = marked.parse(text);
                msgDiv.innerHTML = htmlContent;

                // Highlight code blocks
                msgDiv.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } else {
                msgDiv.textContent = text;
            }

            // Add timestamp
            const timeDiv = document.createElement('div');
            timeDiv.className = 'msg-time';
            timeDiv.textContent = getTime();
            msgDiv.appendChild(timeDiv);

            messagesDiv.appendChild(msgDiv);
            scrollToBottom();
        }

        function setStatus(status) {
            statusDot.className = 'status-indicator';
            if (status === 'online') {
                statusDot.classList.add('online');
                statusText.textContent = 'Online';
            } else if (status === 'connecting') {
                statusDot.classList.add('connecting');
                statusText.textContent = 'Connecting...';
            } else {
                statusDot.classList.add('offline');
                statusText.textContent = 'Offline';
            }
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function clearChat() {
            messagesDiv.innerHTML = '';
            addMessage("Chat cleared. How can I help you?", 'tanvi');
        }

        async function checkBackend() {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({ message: 'ping', session_id: sessionId })
                });
                if (response.ok) {
                    setStatus('online');
                    return true;
                }
            } catch (e) {}
            setStatus('offline');
            return false;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            addTypingIndicator();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({ message, session_id: sessionId })
                });

                removeTypingIndicator();

                if (!response.ok) {
                    if (response.status === 401) {
                        addMessage("**Authentication failed.** Please check the API key.", 'error');
                    } else if (response.status === 502 || response.status === 503) {
                        addMessage("Tanvi is waking up from sleep mode. Please wait 20‑30 seconds and try again.", 'error');
                    } else {
                        addMessage(`**Server error (${response.status}).** Please try again.`, 'error');
                    }
                    setStatus('offline');
                } else {
                    const data = await response.json();
                    if (data.reply) {
                        addMessage(data.reply, 'tanvi');
                        setStatus('online');
                    } else if (data.error) {
                        addMessage(`**Error:** ${data.error}`, 'error');
                    }
                }
            } catch (error) {
                removeTypingIndicator();
                addMessage("**Connection failed.** Please check your internet and try again.", 'error');
                setStatus('offline');
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send on Enter, new line on Shift+Enter
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Initialize
        setStatus('connecting');
        checkBackend().then(online => {
            if (online) {
                addMessage("Hello! I'm **Tanvi**, an AI assistant built from scratch by Dhruv. I can help with code, answer questions, explain concepts, and more. What would you like to explore?", 'tanvi');
            } else {
                addMessage("**Tanvi is waking up...** This may take 20‑30 seconds on first connection . Please wait and try again.", 'error');
                setTimeout(async () => {
                    const ok = await checkBackend();
                    if (ok) {
                        addMessage("I'm awake now! How can I help you today?", 'tanvi');
                    } else {
                        addMessage("**Still connecting...** Please refresh or try again shortly.", 'error');
                    }
                }, 20000);
            }
        });
    </script>
</body>
    </html>
