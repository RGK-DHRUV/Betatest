<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanvi AI – Beta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 700px;
            background: #12121a;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .chat-header {
            background: #1a1a2e;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #2a2a3e;
        }
        .chat-header h1 {
            font-size: 1.5rem;
            color: #7c8aff;
        }
        .chat-header p {
            font-size: 0.8rem;
            color: #888;
            margin-top: 5px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: #7c8aff;
            color: #fff;
        }
        .message.tanvi {
            align-self: flex-start;
            background: #1e1e2e;
            border: 1px solid #2a2a3e;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #2a2a3e;
            background: #12121a;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #2a2a3e;
            border-radius: 25px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 1rem;
            outline: none;
        }
        .chat-input button {
            margin-left: 10px;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: #7c8aff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover { background: #6b78e0; }
        .chat-input button:disabled { background: #444; cursor: not-allowed; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Tanvi AI</h1>
            <p>Beta Preview – Built by Dhruv</p>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." autofocus>
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const API_URL = " http://127.0.0.1:5000/chat";   // Change to your phone's IP or ngrok URL
        const API_KEY = "tanvi-beta-2024-dhruv";        // Must match backend

        const messagesDiv = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            addMessage(message, 'user');
            userInput.value = '';
            sendBtn.disabled = true;
            sendBtn.textContent = '...';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                if (data.reply) {
                    addMessage(data.reply, 'tanvi');
                } else {
                    addMessage("Sorry, something went wrong.", 'tanvi');
                }
            } catch (error) {
                addMessage("Could not connect to Tanvi. Make sure the backend is running.", 'tanvi');
            }
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        addMessage("Hello! I'm Tanvi. How can I help you today?", 'tanvi');
    </script>
</body>
</html>
